  <desc id="desc">Banner for ChatUB: local Arabic AI academic assistant with semantic search and Ollama.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
